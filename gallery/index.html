<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Shadat Hossain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ../ because we're inside /gallery/ folder -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <div class="nav-avatar" id="navAvatar">
                    <span class="nav-avatar-logo">
                        <span class="logo-bracket">&lt;</span><span class="logo-text">SH</span><span class="logo-bracket">/&gt;</span>
                    </span>
                </div>
                <div class="logo-info">
                    <span class="logo-name">Shadat Hossain</span>
                    <span class="logo-role">Network & Security</span>
                </div>
            </a>
            <div class="nav-actions" style="margin-left:auto;">
                <a href="../index.html" class="btn btn-outline btn-sm">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </nav>

    <main style="padding-top: calc(var(--nav-height) + var(--space-2xl)); padding-bottom: 5rem; min-height: 100vh;">    
        <div class="section-container" style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--space-xl);">
            <div class="section-header">
                <span class="section-number">Gallery</span>
                <h1 class="section-title">Photo & Video Gallery</h1>
                <p class="section-subtitle">Memories, moments, and milestones</p>
            </div>

            <div class="gallery-filters" id="galleryFilters">
                <button class="filter-btn active" data-gallery-filter="all"><i class="fas fa-th-large"></i> All</button>
                <button class="filter-btn" data-gallery-filter="image"><i class="fas fa-image"></i> Photos</button>
                <button class="filter-btn" data-gallery-filter="video"><i class="fas fa-video"></i> Videos</button>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <div class="gallery-loading" style="grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--text-secondary);">
                    <i class="fas fa-spinner fa-spin" style="font-size:2.5rem;color:var(--accent-primary);"></i>
                    <p style="margin-top:1rem;">Loading gallery from Google Drive...</p>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/gdrive-public-config.js"></script>
    <script src="../js/site-settings-loader.js"></script>   <!-- NEW -->
    <script src="../js/gallery-page.js"></script>
</body>
</html>
